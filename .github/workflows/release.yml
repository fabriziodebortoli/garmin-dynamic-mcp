name: Release

# One release path for everything. A version bump plus CHANGELOG entry is merged into main (by the catalog
# watcher's pull request or by a hand-written release pull request). If the version in pyproject.toml has no
# tag yet: test, build, publish to PyPI (trusted publishing), create the tag and the GitHub release, then
# publish server.json to the official MCP Registry. Doing it all here avoids the trap that tags pushed with
# the default GITHUB_TOKEN do not start other workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is there a version to release?
    # Trusted publishing does not bind a branch: without this, "Run workflow" on any branch could publish.
    # When this job is skipped its outputs are empty and every later job is skipped too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: python3 scripts/release_check.py

  test:
    name: Test
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: Build
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/garmin-dynamic-mcp
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcpb:
    name: Claude Desktop extension
    # After PyPI has the version: the bundle pins garmin-dynamic-mcp==VERSION. Read-only on purpose: this job
    # runs an npm tool (the pinned MCPB CLI), so it gets no write token and no OIDC.
    needs: [check, publish-pypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the extension
        run: python3 scripts/build_mcpb.py "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: build/garmin-dynamic-mcp.mcpb
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [check, publish-pypi, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: mcpb-dist/
      - name: Create the release
        run: |
          python3 scripts/changelog_section.py CHANGELOG.md "$VERSION" > notes.md
          gh release create "v${VERSION}" dist/* mcpb-dist/garmin-dynamic-mcp.mcpb --title "v${VERSION}" --notes-file notes.md --target "$GITHUB_SHA"

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [check, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry, no stored token
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.9
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
