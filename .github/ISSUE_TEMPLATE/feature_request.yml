name: Feature request
description: Suggest something this server should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The server keeps two generic tools on purpose, so "add a tool for X" is usually answered by showing how to ask for X
        with `get`. Tell us what you tried to do and could not.
        **Never paste your Garmin key** or personal data.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: The question you wanted to ask, or the data you wanted to reach.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What happened when you tried?
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
    validations:
      required: false
  - type: checkboxes
    id: key-check
    attributes:
      label: Confirmation
      options:
        - label: I did not include my Garmin key, a token, or personal data in this issue.
          required: true
