[project]
name = "garmin-dynamic-mcp"
version = "0.2.0"
description = "Dynamic, secure, read-only MCP server for the Garmin Connect Personal API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabrizio De Bortoli" }]
keywords = ["mcp", "model-context-protocol", "garmin", "garmin-connect", "claude", "fitness", "health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "keyring>=25",
]

[project.urls]
Homepage = "https://github.com/fabriziodebortoli/garmin-dynamic-mcp"
Repository = "https://github.com/fabriziodebortoli/garmin-dynamic-mcp"
Issues = "https://github.com/fabriziodebortoli/garmin-dynamic-mcp/issues"
Changelog = "https://github.com/fabriziodebortoli/garmin-dynamic-mcp/blob/main/CHANGELOG.md"

[project.scripts]
garmin-dynamic-mcp = "garmin_dynamic_mcp.cli:entry_point"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_dynamic_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs GARMIN_API_KEY and network (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
